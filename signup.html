<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | NoteKeeper</title>
  <link rel="icon" type="image/png" href="assets/notekeeper-icon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="account-page signup">
  <nav class="navbar navbar-expand-lg site-nav"><div class="container">
    <a class="navbar-brand brand d-flex align-items-center" href="index.html"><img src="assets/notekeeper-icon.png" alt="" class="brand-icon"><span>NoteKeeper</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNav" aria-controls="siteNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="siteNav"><div class="navbar-nav ms-auto align-items-lg-center gap-lg-2"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="login.html">Login</a><a class="btn btn-primary nav-cta" href="signup.html">Sign up</a></div></div>
  </div></nav>

  <main class="account-main"><div class="container">
    <div class="account-card">
      <div class="account-heading"><img src="assets/notekeeper-icon.png" alt="" class="account-icon"><span class="eyebrow">A fresh page starts here</span><h1>Create your account</h1><p>Make a little space for all your ideas.</p></div>
      <form>
        <div class="mb-3"><label for="name" class="form-label">Full name</label><input class="form-control" type="text" id="name" name="name" placeholder="Your name" required></div>
        <div class="mb-3"><label for="email" class="form-label">Email address</label><input class="form-control" type="email" id="email" name="email" placeholder="you@example.com" required></div>
        <div class="mb-3"><label for="password" class="form-label">Password</label><input class="form-control" type="password" id="password" name="password" placeholder="Create a password" required></div>
        <div class="mb-4"><label for="confirmPassword" class="form-label">Confirm password</label><input class="form-control" type="password" id="confirmPassword" name="confirmPassword" placeholder="Enter your password again" required></div>
        <button class="btn btn-primary w-100" type="submit">Create account</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="account-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
    <p class="back-home"><a href="index.html">Back to home</a></p>
  </div></main>
  <footer class="site-footer"><div class="container d-flex flex-column flex-sm-row justify-content-between gap-2"><span class="footer-brand">NoteKeeper</span><span>Your ideas, neatly kept.</span><span>© 2026 NoteKeeper</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/site.js"></script>
</body></html>
